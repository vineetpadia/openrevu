[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openrevu"
version = "0.3.0"
description = "Free PDF markup, measurement/takeoff and review tool (an open-source alternative to Bluebeam Revu)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["pymupdf>=1.24", "PyQt5>=5.15", "numpy"]

[project.optional-dependencies]
sign = ["pyhanko>=0.25"]
fill = ["numpy", "scipy"]
ocr = []  # needs the system tesseract binary
test = ["pytest", "pyhanko>=0.25", "cryptography", "numpy", "scipy"]

[project.scripts]
openrevu = "openrevu.gui:main"
openrevu-cli = "openrevu.cli:main"

[tool.setuptools]
packages = ["openrevu"]

[tool.setuptools.package-data]
openrevu = ["icons_svg/*.svg", "icons_svg/LICENSE*"]
