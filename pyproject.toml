[project]
name = "openrevu"
version = "0.2.0"
description = "Free PDF markup, measurement/takeoff and review tool (an open-source alternative to Bluebeam Revu)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["pymupdf>=1.24", "PyQt5>=5.15"]

[project.optional-dependencies]
sign = ["pyhanko>=0.25"]
test = ["pytest", "pyhanko>=0.25", "cryptography"]

[project.scripts]
openrevu = "openrevu.gui:main"
openrevu-cli = "openrevu.cli:main"

[tool.setuptools]
packages = ["openrevu"]
